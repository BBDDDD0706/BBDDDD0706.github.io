<!doctype html><meta charset="utf-8"><body>sending...<script>
(async()=>{const n=new URLSearchParams(location.search).get('img');
const b=await (await fetch(n)).blob();const fr=new FileReader();
fr.onload=()=>{window.opener.postMessage({name:n,data:fr.result},'*');document.body.textContent='sent';setTimeout(()=>window.close(),1500)};
fr.readAsDataURL(b);})();
</script>
